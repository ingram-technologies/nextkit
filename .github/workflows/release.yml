name: Release

on:
  push:
    branches: [main]

# Publishes to npm using the NPM_TOKEN secret (a granular access token).
# `id-token: write` is kept so npm still attaches build provenance.
# (Trusted Publishing via OIDC is the nicer long-term option, but it requires a
# per-package trusted-publisher config on npmjs.com — without it the publish
# E404s. The token works for all packages with no per-package setup.)
permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted Publishing requires a recent npm (>= 11.5.1) for OIDC + provenance.
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          # Opens/updates a "Version Packages" PR from pending changesets; when
          # that PR is merged, publishes the bumped packages.
          version: bun run version-packages
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
