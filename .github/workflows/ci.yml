name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Lint & format check
        run: bun run check
      - name: Type-check
        run: bun run type-check
      - name: Build
        run: bun run build
      - name: Test
        run: bun run test
